version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        update-types:
          - minor
          - patch
    ignore:
      # Actions are pinned to their floating major tag, so patch and minor
      # releases are picked up without a pull request. Only major bumps,
      # which can break the workflow contract, are worth reviewing.
      - dependency-name: '*'
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
