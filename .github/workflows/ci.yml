name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5.6.0
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Run tests
        run: make test
      - name: Check formatting
        run: make format-check

  quality:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5.6.0
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Install build tools into local repository
        run: mvn install -DskipTests -q
      - name: Run quality checks
        run: make quality
