# The corpus scoreboard, committed, one line per profile.
#
# <profile>.reviewed  scenarios whose expectations a human has read and vouched for
# <profile>.passing   how many of those the engine currently gets right
#
# The build fails below the floor (a regression) and above it (progress the floor
# has not recorded). Raising these numbers is how a lot proves it moved the needle.
#
# The profiles are scored apart on purpose: one total would let a gain on sources
# written in our own vocabulary pay for a loss on sources that have none.
profile1.reviewed=143
profile1.passing=143
profile2.reviewed=6
profile2.passing=6
